<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SplitApp</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center;
        justify-content: center; padding: 2rem; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafafa; color: #18181b;
      }
      @media (prefers-color-scheme: dark) { body { background: #000; color: #fafafa; } }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0; font-size: .875rem; opacity: .7; max-width: 24rem; }
    </style>
  </head>
  <body>
    <!-- Deliberately static and user-data-free: this page is the only thing the
         service worker will serve when the network is unreachable. -->
    <div>
      <h1>You're offline</h1>
      <p>
        SplitApp needs a connection to show your groups and balances. Reconnect and
        try again.
      </p>
    </div>
  </body>
</html>
