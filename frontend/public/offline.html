<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SplitApp</title>
    <style>
      /* Khata palette, hard-coded: this page can never load the app's CSS. */
      :root { color-scheme: light dark; --ground: #f7f8f4; --ink: #1b2430; --faint: #8c95a1; }
      @media (prefers-color-scheme: dark) {
        :root { --ground: #12161a; --ink: #e7eae4; --faint: #6d7883; }
      }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center;
        justify-content: center; padding: 2rem; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--ground); color: var(--ink);
      }
      .label {
        font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
        font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase;
        color: var(--faint); margin: 0 0 .75rem;
      }
      h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 .5rem; }
      p { margin: 0; font-size: .875rem; color: var(--faint); max-width: 24rem; }
    </style>
  </head>
  <body>
    <!-- Deliberately static and user-data-free: this page is the only thing the
         service worker will serve when the network is unreachable. -->
    <div>
      <p class="label">SplitApp</p>
      <h1>You're offline</h1>
      <p>
        SplitApp needs a connection to show your groups and balances. Reconnect and
        try again.
      </p>
    </div>
  </body>
</html>
